name: hotel-watch

on:
  schedule:
    # 15分おき（GitHubのcronはベストエフォートで数分〜十数分遅れることがある）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# state.json をコミットで戻すため書き込み権限が必要
permissions:
  contents: write

# 実行の重複を防ぐ
concurrency:
  group: hotel-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-refresh.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-refresh.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prepare config
        run: cp config.ci.json config.json

      - name: Get fresh client_session
        run: |
          set -e
          token=$(python refresh_session.py --print)
          if [ -z "$token" ]; then
            echo "::error::client_session を取得できませんでした"
            exit 1
          fi
          echo "CLIENT_SESSION=$token" >> "$GITHUB_ENV"

      - name: Run watcher
        env:
          CLIENT_SESSION: ${{ env.CLIENT_SESSION }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python hotel_watch.py

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":warning: hotel-watch の実行が失敗しました。\nhttps://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Persist state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json に変更なし"
            exit 0
          fi
          git commit -m "chore: update state.json [skip ci]"
          # 他の実行と同時にpushして衝突することがあるのでリトライする。
          # state.json しか触っていないので、衝突時はこちらの内容を優先して解決する。
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push が衝突しました。rebaseしてリトライします ($i/5)"
            git fetch origin main
            git rebase origin/main -X ours || { git rebase --abort; }
            sleep $((i * 2))
          done
          echo "::error::state.json のpushに失敗しました(5回リトライ後)"
          exit 1
