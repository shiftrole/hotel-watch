name: hotel-watch

on:
  schedule:
    # 30分おき（GitHubのcronはベストエフォートで数分〜十数分遅れることがある）
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# state.json をコミットで戻すため書き込み権限が必要
permissions:
  contents: write

# 実行の重複を防ぐ
concurrency:
  group: hotel-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Prepare config
        run: cp config.ci.json config.json

      - name: Run watcher
        env:
          CLIENT_SESSION: ${{ secrets.CLIENT_SESSION }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python hotel_watch.py

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":warning: hotel-watch の実行が失敗しました。client_session の失効かもしれません。\nhttps://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Persist state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state.json [skip ci]"
          git push
